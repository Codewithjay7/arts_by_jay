# ============================================================================
# Arts by Jay — Netlify deployment
#
# Netlify serves the STATIC frontend only. The backend is Supabase:
# PostgreSQL + Auth + Storage + Edge Functions. Nothing from `server/` runs
# here, and nothing needs to.
#
# Site: artsbyjay.netlify.app
# ============================================================================

[build]
  # Netlify changes into this directory, and runs the install and the build
  # from here. Everything below is therefore relative to `client/`.
  base = "client"
  command = "npm run build"
  # Relative to `base`, NOT to the repo root. Writing "client/dist" here
  # resolves to client/client/dist and fails with "deploy directory does not
  # exist" — which is exactly how the first three deploys failed.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"
  # NODE_ENV is deliberately NOT set to "production" here. npm treats that as
  # "skip devDependencies", and vite is a devDependency — so the install would
  # succeed and then `npm run build` would fail with "vite: not found".
  # Vite already builds in production mode for `vite build`.

# ────────────────────────── SPA routing ──────────────────────────
# React Router owns every path. Without this, a deep link like
# /art/lime-interval or a refresh on /checkout returns Netlify's 404 instead
# of the app. The 200 status matters: a 301 would break client-side routing.
#
# Order matters here: Netlify applies the FIRST matching rule, so the /api
# rule below has to come before the catch-all.

# There is no backend on this host. The API is Supabase, called directly from
# the browser, and nothing should ever request /api/* here.
#
# Without this rule the catch-all below answers /api/anything with index.html
# and HTTP 200 — so a stray fetch "succeeds" and hands the caller a page of
# HTML where it expected JSON. That is exactly how the checkout page came to
# fail silently against routes that no longer existed. A 404 makes such a
# call fail where it is made, which is the only place it can be fixed.
[[redirects]]
  from = "/api/*"
  to = "/api-gone.json"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ────────────────────────── Security headers ──────────────────────────
# This site takes payments, so these are not optional.
#
# The CSP allowlist is exhaustive for what the app actually loads. If you add
# a service, add its origin here or the browser blocks it silently — check the
# console first when something stops working.
#
#   *.supabase.co        database, auth, storage, realtime (wss)
#   *.razorpay.com       checkout script, its iframe, and its API
#   js.stripe.com        only if the provider is switched to Stripe
#   blob: / data:        the photo studio reads a local file into a canvas
#
# No font or style origins are needed: the app uses the system font stack and
# loads no webfonts.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://*.razorpay.com https://js.stripe.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: https://*.supabase.co https://*.razorpay.com;
      media-src 'self' blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.razorpay.com https://api.stripe.com;
      frame-src https://*.razorpay.com https://js.stripe.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests
    """

# ────────────────────────── Caching ──────────────────────────
# Vite fingerprints every asset filename, so hashed files are immutable and
# can be cached for a year. index.html must NOT be, or visitors keep getting
# an old bundle after a deploy.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
